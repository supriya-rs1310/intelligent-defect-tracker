spring.application.name=defect_tracker


# 1. DATABASE ROUTING ENGINE
# spring.datasource.url=jdbc:mysql://localhost:3306/defect_tracker_db?useSSL=false&serverTimezone=UTC
spring.datasource.url=jdbc:mysql://localhost:3306/defect_tracker_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Supriya@2003
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# 2. DATA INTEGRITY SAFEGUARD
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect


# 3. HIGH-PERFORMANCE HIKARI POOL TUNING
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2


# Logging
logging.level.com.miniproject.defect_tracker=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n


# 4. GEMINI API KEY
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-lite:generateContent

gemini.api.key=YOUR_GEMINI_API_KEY_HERE